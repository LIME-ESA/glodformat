[build-system]
requires = ["setuptools>=58.1.0", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glodformat"
dynamic = ["version"]
description = "Reader and diagnostics toolkit for GLOD netCDF files, LIME-specific LGLOD files, and SRF observations."
readme = "README.md"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Javier Gatón Herguedas", email = "gaton@goa.uva.es" },
]
maintainers = [
    { name = "Javier Gatón Herguedas", email = "gaton@goa.uva.es" }
]
requires-python = ">=3.10"
classifiers=[
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "netcdf4~=1.7",
    "PyYAML~=6.0",
    "pandera~=0.36.0",
    "xarray>=2024.10.0",
]

[project.optional-dependencies]
dev = ["pre-commit", "pytest"]
docs = ["sphinx~=7.0", "sphinx_rtd_theme", "myst_parser", "sphinxcontrib-openapi", "linkify-it-py"]

[project.urls]
Homepage = "https://lime.uva.es"
Repository = "https://github.com/LIME-ESA/glodformat.git"
Issues = "https://github.com/LIME-ESA/glodformat/issues"

[tool.setuptools.packages.find]
where = [""]
include = ["glodformat*"]
#exclude = ["*tests"]

[tool.setuptools_scm]
root = "."
fallback_version = "1"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "glodformat/_version.py"
versionfile_build = "glodformat/_version.py"
tag_prefix = ""
parentdir_prefix = ""

[tool.flake8]
exclude = ["docs"]
max-line-length = 120
extend-ignore = ["W291"]

[tool.mypy]
allow_untyped_globals = true
ignore_missing_imports = true

[tool.mypy-setup]
ignore_errors = true

[tool.mypy-tests]
ignore_errors = true

[tool.mypy-versioneer]
ignore_errors = true
